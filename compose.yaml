services:
  device-passport:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DEVICEPASSPORT_ADMIN_EMAIL: ${DEVICEPASSPORT_ADMIN_EMAIL}
      DEVICEPASSPORT_ADMIN_PASSWORD: ${DEVICEPASSPORT_ADMIN_PASSWORD}
      DEVICEPASSPORT_SESSION_SECRET: ${DEVICEPASSPORT_SESSION_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    volumes:
      - devicepassport-data:/app/.data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  devicepassport-data:
