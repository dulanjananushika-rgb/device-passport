services:
  - type: web
    name: device-passport
    runtime: docker
    repo: https://github.com/dulanjananushika-rgb/device-passport
    branch: codex/portfolio-demo
    region: singapore
    plan: free
    numInstances: 1
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DEVICEPASSPORT_DEMO
        value: "true"
      - key: DEVICEPASSPORT_SESSION_SECRET
        generateValue: true
